<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz CANUT · Consultime</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{width:100%;max-width:700px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 40px rgba(26,60,143,.13)}
.hd{background:#1a3c8f;padding:.9rem 1.4rem;display:flex;align-items:center;justify-content:space-between}
.hd img{height:32px;filter:brightness(0) invert(1)}
.hd-r{display:flex;align-items:center;gap:.6rem}
.hd-lbl{color:rgba(255,255,255,.55);font-size:.78rem}
.cnt{background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:.18rem .65rem;font-size:.8rem;font-weight:700}
.pbar{height:4px;background:#e8edf8}
.pfill{height:100%;background:linear-gradient(90deg,#1a3c8f,#e85d04);transition:width .4s ease}
.bd{padding:1.4rem}
.tags{display:flex;gap:.4rem;margin-bottom:.9rem;flex-wrap:wrap;align-items:center}
.tag{padding:.2rem .65rem;border-radius:4px;font-size:.67rem;font-weight:700;letter-spacing:.04em}
.tag-niv{display:flex;align-items:center;gap:3px}
.ndot{width:6px;height:6px;border-radius:50%;display:inline-block}
.rev-hint{font-size:.7rem;color:#7c3aed;background:#f5f3ff;border:1px solid #c4b5fd;border-radius:5px;padding:.2rem .55rem}
.qtext{font-size:1rem;font-weight:600;color:#1e293b;line-height:1.65;margin-bottom:1.2rem}
.opts{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.1rem}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:.72rem .95rem;color:#1e293b;font-size:.875rem;line-height:1.5;cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:.7rem;transition:border-color .15s,background .15s;font-family:inherit;width:100%}
.opt:hover:not(:disabled){border-color:#1a3c8f;background:#1a3c8f08}
.opt:disabled{cursor:default}
.opt.ok{background:#f0fdf4;border-color:#86efac;color:#16a34a}
.opt.ko{background:#fef2f2;border-color:#fca5a5;color:#dc2626}
.opt.neutral-rev{background:#f8faff;border-color:#bfcfef;color:#475569}
.ic{min-width:1.45rem;height:1.45rem;border-radius:50%;background:#f1f4f9;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0;margin-top:1px}
.ic.ok{background:#16a34a;color:#fff}
.ic.ko{background:#dc2626;color:#fff}
.exp-box{background:#f1f4f9;border-radius:10px;padding:.85rem .95rem;margin-bottom:1rem;border:1px solid #e2e8f0}
.exp-toggle{background:none;border:none;color:#1a3c8f;font-size:.82rem;font-weight:700;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;font-family:inherit}
.exp-arr{color:#e85d04}
.exp-text{color:#475569;font-size:.83rem;line-height:1.7;margin-top:.7rem;border-top:1px solid #e2e8f0;padding-top:.7rem;display:none}
.exp-text.open{display:block}
.actions{display:flex;gap:.6rem;margin-bottom:1rem}
.btn-back{flex:0 0 auto;padding:.78rem 1.1rem;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;color:#475569;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:.35rem;transition:border-color .15s,color .15s}
.btn-back:hover:not(:disabled){border-color:#1a3c8f;color:#1a3c8f}
.btn-back:disabled{opacity:.3;cursor:default}
.btn-next{flex:1;padding:.78rem;background:#1a3c8f;border:none;border-radius:10px;color:#fff;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:.4rem}
.arr-o{color:#e85d04;font-size:1.05rem}
.dots{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;min-height:14px}
.dn{height:7px;border-radius:999px;transition:all .3s;cursor:pointer}
.r-hd{background:#1a3c8f;padding:.9rem 1.4rem;display:flex;align-items:center;justify-content:space-between}
.r-hd img{height:30px;filter:brightness(0) invert(1)}
.r-hd span{color:rgba(255,255,255,.6);font-size:.78rem}
.r-bd{padding:1.75rem}
.score-wrap{text-align:center;margin-bottom:1.5rem}
.score-c{display:inline-flex;align-items:center;justify-content:center;width:90px;height:90px;border-radius:50%;border:3px solid;margin-bottom:.8rem;font-size:1.6rem;font-weight:800}
.badge-pill{display:inline-block;padding:.28rem .9rem;border-radius:999px;font-weight:700;font-size:.84rem;margin-top:.35rem}
.super-badge{background:linear-gradient(135deg,#1a3c8f 0%,#e85d04 100%);color:#fff;border-radius:14px;padding:1.1rem 1.3rem;margin-bottom:1.2rem;text-align:center}
.super-badge .sb-star{font-size:2rem;margin-bottom:.3rem}
.super-badge .sb-title{font-size:1rem;font-weight:800;margin-bottom:.2rem}
.super-badge .sb-sub{font-size:.78rem;opacity:.85;line-height:1.5}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.4rem}
.ri{padding:.5rem .75rem;border-radius:8px;display:flex;align-items:center;gap:.45rem;cursor:pointer;transition:opacity .15s}
.ri:hover{opacity:.75}
.ri.ok{background:#f0fdf4;border:1px solid #86efac}
.ri.ko{background:#fef2f2;border:1px solid #fca5a5}
.ri .t{font-size:.88rem;font-weight:700}
.ri .t.ok{color:#16a34a}.ri .t.ko{color:#dc2626}
.ri .inf .s{font-size:.63rem;color:#94a3b8}
.ri .inf .l{font-size:.75rem;color:#475569;font-weight:500}
.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:.9rem;margin-bottom:1.3rem}
.warn .wt{color:#e85d04;font-weight:700;margin-bottom:.2rem;font-size:.84rem}
.warn .wb{color:#475569;font-size:.81rem;line-height:1.6}
.btn-restart{width:100%;padding:.82rem;background:#1a3c8f;border:none;border-radius:10px;color:#fff;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit}
.hidden{display:none!important}
</style>
</head>

      "La dépendance économique survient quand un freelance tire l'essentiel de son CA d'un seul client. Avec Consultime comme intermédiaire, le lien contractuel est entre l'acheteur et Consultime — ce qui réduit structurellement ce risque. Les missions longues ou exclusives restent à monitorer.",
      "Ce risque est nul dans le secteur public : la requalification en salarié ne peut pas intervenir avec une personne publique comme employeur de fait.",
      "Consultime impose contractuellement à ses consultants un plafond de 60% de leur CA chez un même client — garantie intégrée dans les conditions générales d'intervention."
    ],
    c:1,
    exp:"La dépendance économique survient quand un freelance tire plus de 75% de son CA d'un seul client — situation pouvant favoriser une requalification en salarié. Avec Consultime comme intermédiaire, le lien contractuel est Consultime/acheteur (pas freelance/acheteur directement), ce qui réduit structurellement ce risque. Mais les missions longues à temps plein exclusif restent à monitorer. Ce risque existe dans le secteur public comme ailleurs — et il n'y a pas de plafond contractuel de 60% imposé."
  }

const NVCFG = {
  "Fondamental": {"bg":"#eff6ff","border":"#bfdbfe","text":"#1d4ed8","dot":"#3b82f6"},
  "Courant":     {"bg":"#fffbeb","border":"#fcd34d","text":"#d97706","dot":"#f59e0b"},
  "Avancé":      {"bg":"#fdf4ff","border":"#e9d5ff","text":"#7e22ce","dot":"#a855f7"}
};
const THCOL = {
  "Cadre juridique CANUT":        "#1a3c8f",
  "Processus de contractualisation":"#e85d04",
  "Modèle économique & transparence":"#0891b2",
  "Qualité & profils":            "#16a34a",
  "Risques juridiques":           "#dc2626",
  "Différenciation vs plateformes":"#7c3aed"
};

const NQ = 16;
let session=[], cur=0, answers=[], expOpen=false, reviewMode=false, reviewOrigin=-1;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function init(){
  session=shuffle(BANK).slice(0,NQ);
  cur=0;answers=[];expOpen=false;reviewMode=false;reviewOrigin=-1;
  document.getElementById("quiz-screen").classList.remove("hidden");
  document.getElementById("results-screen").classList.add("hidden");
  render();
}

function render(){
  const q=session[cur], total=session.length;
  const answered=(answers[cur]!==undefined);
  const nv=NVCFG[q.niveau]||NVCFG["Fondamental"];
  const tc=THCOL[q.theme]||"#1a3c8f";

  document.getElementById("counter").textContent=(cur+1)+"/"+total;
  document.getElementById("pfill").style.width=((cur/total)*100)+"%";

  let tagsHTML="";
  if(reviewMode) tagsHTML+='<span class="rev-hint">👁 Mode révision</span>';
  tagsHTML+='<span class="tag" style="background:'+tc+'18;color:'+tc+'">'+q.theme+'</span>';
  tagsHTML+='<span class="tag tag-niv" style="background:'+nv.bg+';color:'+nv.text+';border:1px solid '+nv.border+'"><span class="ndot" style="background:'+nv.dot+'"></span>'+q.niveau+'</span>';
  document.getElementById("tags").innerHTML=tagsHTML;
  document.getElementById("qtext").textContent=q.q;

  const optsEl=document.getElementById("opts");
  optsEl.innerHTML="";
  q.opts.forEach(function(opt,idx){
    const btn=document.createElement("button");
    btn.className="opt";
    const letter=String.fromCharCode(65+idx);
    btn.innerHTML='<span class="ic" id="ic'+idx+'">'+letter+'</span>'+opt;
    if(!answered && !reviewMode){
      btn.onclick=function(){handleSelect(idx);};
    } else {
      btn.disabled=true;
      if(idx===q.c){
        btn.classList.add("ok");
        setTimeout(function(){
          const ic=document.getElementById("ic"+idx);
          if(ic){ic.classList.add("ok");ic.textContent="✓";}
        },0);
      } else if(answered && answers[cur]===idx && idx!==q.c){
        btn.classList.add("ko");
        setTimeout(function(){
          const ic=document.getElementById("ic"+idx);
          if(ic){ic.classList.add("ko");ic.textContent="✗";}
        },0);
      } else {
        btn.classList.add("neutral-rev");
      }
    }
    optsEl.appendChild(btn);
  });

  expOpen=false;
  const expBox=document.getElementById("exp-box");
  if(answered||reviewMode){
    expBox.classList.remove("hidden");
    document.getElementById("exp-text").textContent=q.exp;
    document.getElementById("exp-text").classList.remove("open");
    document.getElementById("exp-arr").textContent="▶";
    document.getElementById("exp-lbl").textContent="Voir l’explication";
  } else {
    expBox.classList.add("hidden");
  }

  const btnBack=document.getElementById("btn-back");
  btnBack.disabled=(cur===0 && !reviewMode);

  const btnNext=document.getElementById("btn-next");
  if(answered||reviewMode){
    btnNext.classList.remove("hidden");
    if(reviewMode){
      document.getElementById("next-lbl").textContent=(cur+1>=total)?"Retour aux résultats":"Question suivante";
    } else {
      document.getElementById("next-lbl").textContent=(cur+1>=total)?"Voir mes résultats":"Question suivante";
    }
  } else {
    btnNext.classList.add("hidden");
  }
  renderDots();
}

function handleSelect(idx){
  if(answers[cur]!==undefined)return;
  answers[cur]=idx;
  render();
}

function goBack(){
  if(reviewMode){if(cur===0){exitReview();return;}cur--;render();return;}
  if(cur===0)return;
  cur--;render();
}

function goNext(){
  if(reviewMode){if(cur+1>=session.length){exitReview();return;}cur++;render();return;}
  cur++;
  if(cur>=session.length){showResults();}else{render();}
}

function exitReview(){
  document.getElementById("quiz-screen").classList.add("hidden");
  document.getElementById("results-screen").classList.remove("hidden");
  reviewMode=false;
}

function toggleExp(){
  expOpen=!expOpen;
  document.getElementById("exp-text").classList.toggle("open",expOpen);
  document.getElementById("exp-arr").textContent=expOpen?"▼":"▶";
  document.getElementById("exp-lbl").textContent=expOpen?"Masquer l’explication":"Voir l’explication";
}

function renderDots(){
  const dotsEl=document.getElementById("dots");
  dotsEl.innerHTML="";
  session.forEach(function(_,i){
    const d=document.createElement("div");
    d.className="dn";
    if(i<cur){
      d.style.width="7px";
      d.style.background=(answers[i]===session[i].c)?"#16a34a":"#dc2626";
    } else if(i===cur){
      d.style.width="18px";
      d.style.background="#1a3c8f";
    } else {
      d.style.width="7px";
      d.style.background="#e2e8f0";
    }
    d.title="Q"+(i+1)+" · "+session[i].theme;
    if(answers[i]!==undefined||reviewMode){d.onclick=function(){cur=i;render();};}
    dotsEl.appendChild(d);
  });
}

function showResults(){
  document.getElementById("quiz-screen").classList.add("hidden");
  document.getElementById("results-screen").classList.remove("hidden");
  const total=session.length;
  const score=session.filter(function(_,i){return answers[i]===session[i].c;}).length;
  const pct=Math.round(score/total*100);
  const perfect=(score===total);
  let bc,bl;
  if(perfect){bc="#1a3c8f";bl="Super Commercial Public ⭐";}
  else if(pct>=75){bc="#16a34a";bl="Expert CANUT";}
  else if(pct>=55){bc="#d97706";bl="Niveau confirmé";}
  else{bc="#dc2626";bl="Formation requise";}

  const sc=document.getElementById("sc");
  sc.textContent=pct+"%";
  sc.style.borderColor=bc;sc.style.color=bc;sc.style.background=bc+"18";
  document.getElementById("slbl").textContent=score+"/"+total+" bonnes réponses";
  document.getElementById("badge-el").innerHTML='<span class="badge-pill" style="background:'+bc+'18;color:'+bc+'">'+bl+'</span>';

  const superEl=document.getElementById("super-badge-el");
  if(perfect){
    superEl.innerHTML='<div class="super-badge"><div class="sb-star">⭐</div><div class="sb-title">Super Commercial Public</div><div class="sb-sub">Score parfait ! Tu maîtrises le marché CANUT et les objections juridiques.<br>Tu peux répondre à n’importe quel acheteur public en toute confiance.</div></div>';
  } else {
    superEl.innerHTML="";
  }

  const grid=document.getElementById("rgrid");
  grid.innerHTML="";
  session.forEach(function(q,i){
    const ok=(answers[i]===q.c);
    const div=document.createElement("div");
    div.className="ri "+(ok?"ok":"ko");
    div.title="Cliquer pour revoir";
    div.innerHTML='<span class="t '+(ok?"ok":"ko")+'">'+(ok?"✓":"✗")+'</span><div class="inf"><div class="s">'+q.theme+'</div><div class="l">Q'+(i+1)+" · "+q.niveau+"</div></div>";
    div.onclick=function(){enterReview(i);};
    grid.appendChild(div);
  });

  const warnEl=document.getElementById("warn");
  if(pct<75){
    const missed=[];
    session.forEach(function(q,i){if(answers[i]!==q.c)missed.push(q.theme);});
    const uniq=[...new Set(missed)];
    document.getElementById("warn-text").textContent="Thèmes à retravailler : "+uniq.join(", ")+". Relisez le guide objections CANUT et la note acheteuse.";
    warnEl.classList.remove("hidden");
  } else {
    warnEl.classList.add("hidden");
  }
}

function enterReview(idx){
  reviewOrigin=idx;cur=idx;reviewMode=true;
  document.getElementById("results-screen").classList.add("hidden");
  document.getElementById("quiz-screen").classList.remove("hidden");
  render();
}

function copyResults(){
  const total=session.length;
  const score=session.filter(function(_,i){return answers[i]===session[i].c;}).length;
  const pct=Math.round(score/total*100);
  const missed=[];
  session.forEach(function(q,i){if(answers[i]!==q.c)missed.push(q.theme);});
  const uniq=[...new Set(missed)];
  const date=new Date().toLocaleDateString('fr-FR');
  let txt="🎯 Quiz CANUT — "+date+"\n";
  txt+="Score : "+score+"/"+total+" ("+pct+"%)\n";
  if(pct===100){txt+="Badge : ⭐ Super Commercial Public\n";}
  else if(pct>=75){txt+="Niveau : Expert CANUT ✅\n";}
  else if(pct>=55){txt+="Niveau : Confirmé ⚠️\n";}
  else{txt+="Niveau : Formation requise ❌\n";}
  if(uniq.length){txt+="Thèmes à retravailler : "+uniq.join(", ");}
  else{txt+="Tous les thèmes maîtrisés 💪";}
  navigator.clipboard.writeText(txt).then(function(){
    document.getElementById("copy-icon").textContent="✅";
    document.getElementById("copy-lbl").textContent="Copié !";
    setTimeout(function(){
      document.getElementById("copy-icon").textContent="📋";
      document.getElementById("copy-lbl").textContent="Copier mes résultats";
    },2500);
  }).catch(function(){alert(txt);});
}

    uniq.forEach(function(theme){

        html+='<div><div style="font-weight:700;color:#1e293b;font-size:.84rem">'+doc.name+'</div>';
        html+='<div style="color:#64748b;font-size:.76rem;margin-top:.15rem">'+doc.desc+'</div></div>';
        if(dlHref){html+='<a href="'+dlHref+'" download="'+doc.file+'" style="flex-shrink:0;background:#1a3c8f;color:#fff;border-radius:7px;padding:.3rem .65rem;font-size:.75rem;font-weight:700;text-decoration:none;white-space:nowrap">⬇ Télécharger</a>';}
        html+='</div>';
      });
      html+='</div>';
    });
  }
  html+='</div></div></div>';

  const modal=document.createElement('div');
  modal.id='docs-modal';
  modal.innerHTML=html;
  document.body.appendChild(modal);
}

function restart(){init();}
init();
</script>
